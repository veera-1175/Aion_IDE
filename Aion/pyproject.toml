[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion"
version = "1.0.0"
description = "AION — Autonomous Multi-Agent Software Engineering with Noesis Persistent Memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai-agents", "noesis", "multi-agent", "software-engineering", "llm", "aion"]
dependencies = [
    "noesis",
    "pyyaml>=6.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "httpx>=0.26.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0"]
dev = ["pytest>=7.4.0"]

[project.scripts]
aion = "aion.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aion*"]

[tool.setuptools.package-data]
"aion.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../Noesis_v1"]
